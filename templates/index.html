<!DOCTYPE html>
<html>
<head>
    <title>Media Analysis AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-container">
        <!-- Add nav link at the top -->
        <nav class="nav-bar">
            <div class="nav-links">
                <a href="/lessons-page" class="nav-link">Daily Lessons</a>
                <a href="/map" class="nav-link">World Map</a>
                <a href="/translate" class="nav-link">Language Translation</a>
                <a href="/recommended-ai-tools" class="nav-link">Recommended AI Tools</a>
                <a href="/generate-insights" class="nav-link">Generate Insights</a>
                <br>
                <div class="sidebar-sections">
                    <div class="sidebar-section">
                        <h3>Name of Your Organisation</h3>
                        <div id="org-overview"></div>
                    </div>
                    <div class="sidebar-section">
                        <h3>Key Projects</h3>
                        <div id="org-projects"></div>
                    </div>
                    <div class="sidebar-section">
                        <h3>Team Members</h3>
                        <div id="org-team"></div>
                    </div>
                    <div class="sidebar-section">
                        <h3>Goals & Objectives</h3>
                        <div id="org-goals"></div>
                    </div>
                    <div class="sidebar-section">
                        <h3>Resources & Tools</h3>
                        <div id="org-resources"></div>
                    </div>
                </div>
                <div class="sidebar-footer">
                    <button onclick="updateOrgInfo(true)" class="refresh-btn">
                        Refresh Organization Info
                    </button>
                </div>
            </div>
            

        <!-- Main content remains -->
        <div class="content">
                <!-- Add chat interface -->
                <div class="chat-container">
                    <h2>Chat with AI Assistant</h2>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="Type your message...">
                        <button onclick="sendMessage()">Send</button>
                    </div>
                </div>

                <!-- Fact Input Section -->
                <div class="input-section">
                    <h3>Add fact about your organisation that we should know</h3>
                    <input type="text" id="fact-input" placeholder="Enter a fact about your organization">
                    <button onclick="addFact()">Add Fact</button>
                </div>

    <script>
        function analyzeMedia() {
            const mediaUrl = document.getElementById('mediaUrl').value;
            const results = document.getElementById('results');
            
            results.innerHTML = 'Analyzing...';
            
            fetch('/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ media_url: mediaUrl })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    results.innerHTML = `<pre>${data.analysis}</pre>`;
                } else {
                    results.innerHTML = `Error: ${data.error}`;
                }
            })
            .catch(error => {
                results.innerHTML = `Error: ${error}`;
            });
        }

        let currentChatId = null;

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            appendMessage('user', message);

            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    chat_id: currentChatId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentChatId = data.chat_id;
                    appendMessage('assistant', data.response);
                } else {
                    appendMessage('error', `Error: ${data.error}`);
                }
            })
            .catch(error => {
                appendMessage('error', `Error: ${error}`);
            });
        }

        function appendMessage(role, content) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            messageDiv.innerHTML = `<p>${content}</p>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Add event listener for Enter key
        document.getElementById('chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Add function to load chat history
        function loadChatHistory() {
            fetch('/chats')
            .then(response => response.json())
            .then(chats => {
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = '';
                
                if (chats.length > 0) {
                    const latestChat = chats[chats.length - 1];
                    currentChatId = latestChat.id;
                    
                    latestChat.messages.forEach(msg => {
                        appendMessage(msg.role, msg.content);
                    });
                }
            });
        }

        function updateOrgInfo(refresh = false) {
            const url = refresh ? '/synthesize?refresh=true' : '/synthesize';
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Update each section
                        document.getElementById('org-overview').innerHTML = 
                            formatSection(data.org_info.Organization_Overview);
                        document.getElementById('org-projects').innerHTML = 
                            formatSection(data.org_info.Key_Projects);
                        document.getElementById('org-team').innerHTML = 
                            formatSection(data.org_info.Team_Members);
                        document.getElementById('org-goals').innerHTML = 
                            formatSection(data.org_info.Goals_Objectives);
                        document.getElementById('org-resources').innerHTML = 
                            formatSection(data.org_info.Resources_Tools);
                    } else {
                        console.error('Error updating organization info:', data.error);
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function formatSection(content) {
            if (Array.isArray(content)) {
                return '<ul>' + content.map(item => `<li>${item}</li>`).join('') + '</ul>';
            }
            return content;
        }

        // Update org info after each chat message
        const originalSendMessage = sendMessage;
        sendMessage = async function() {
            await originalSendMessage();
            updateOrgInfo();
        };

        // Initial load of org info
        document.addEventListener('DOMContentLoaded', function() {
            loadChatHistory();
            updateOrgInfo();
        });

        // Add Fact Function
        function addFact() {
            const factInput = document.getElementById('fact-input');
            const fact = factInput.value.trim();
            
            if (fact) {
                fetch('/add-fact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fact: fact })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        factInput.value = '';
                        updateOrgInfo();  // Refresh the sidebar to show new fact
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }

        // Generate Analysis Function
        function generateAnalysis() {
            const analysisInput = document.getElementById('analysis-input');
            const content = analysisInput.value.trim();
            
            if (content) {
                fetch('/analyze-chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: content })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        appendMessage('Analysis: ' + data.analysis);
                        analysisInput.value = '';
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }
    </script>
</body>
</html>
