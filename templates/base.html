<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}MediaMap{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            font-size: 16px;
        }
        .banner {
            background-color: #007bff;
            color: #fff;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .banner-subtitle {
            font-size: 18px;
            font-weight: normal;
            margin-top: 5px;
        }
        .main-container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
            padding: 20px;
        }
        .nav-bar {
            width: 250px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            height: calc(100vh - 40px);
            position: sticky;
            top: 20px;
            overflow-y: auto;
        }
        .nav-links {
            list-style: none;
            padding: 0;
        }
        .nav-link {
            display: block;
            color: #007bff;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .content {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body>
    <div class="banner">
        MediaMap
        <div class="banner-subtitle">Created by Develop AI</div>
    </div>
    <div class="main-container">
        <nav class="nav-bar">
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/lessons-page" class="nav-link">Daily Lessons</a>
                <a href="/map" class="nav-link">World Map</a>
                <a href="/translate" class="nav-link">Language Translation</a>
                <a href="/recommended-ai-tools" class="nav-link">Recommended AI Tools</a>
                <a href="/generate-insights" class="nav-link">Generate Insights</a>
                <a href="/your-info" class="nav-link">Your Info</a>
            </div>
        </nav>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
